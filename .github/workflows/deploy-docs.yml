name: Deploy Documentation
on:
  push:
    branches:
      - main
    tags:
      - v1.*
  # Lets maintainers redeploy (e.g. after fixing repository settings) without
  # waiting for a push. Dispatching from any other ref only runs the build.
  workflow_dispatch:
env:
  RUST_BACKTRACE: 1
  # We can pin the version if nightly is too unstable.
  # Otherwise, we test against the latest version.
  RUST_NIGHTLY_TOOLCHAIN: nightly
  MDBOOK_VERSION: 0.4.34
  MDBOOK_SHA256: 535a109e6f5a838c644fb0615d34f4c12e588b666f7e4b28fb987e79e2807288
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-user-guide:
    if: github.repository == 'aws/aws-lc-rs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: 'recursive'
      - name: Install Nightly Rust Toolchain
        run: |
          rustup toolchain install ${{ env.RUST_NIGHTLY_TOOLCHAIN }} --profile minimal --no-self-update
          rustup default ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.18'
      - name: Build and Test User Guide
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${{ env.MDBOOK_VERSION }}/mdbook-v${{ env.MDBOOK_VERSION }}-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "${{ env.MDBOOK_SHA256 }}" mdbook.tar.gz | sha256sum --check
          tar xzf mdbook.tar.gz
          ./mdbook build book
          ./mdbook test book
      - name: Build Documentation
        run: cargo doc --features fips,unstable --no-deps --workspace
      - name: Copy docs
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p "book/book/rustdocs/${REF_NAME}"
          cp --recursive target/doc -t "book/book/rustdocs/${REF_NAME}"
      - name: Validate documentation artifact
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          test -f book/book/index.html
          test -f "book/book/rustdocs/${REF_NAME}/doc/aws_lc_rs/index.html"
      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book/book

  deploy-user-guide:
    if: github.repository == 'aws/aws-lc-rs' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v1.'))
    needs: build-user-guide
    permissions:
      pages: write
      id-token: write
    # Deployments are gated by the `github-pages` environment. Its deployment
    # branch/tag policies must allow `main` and `v1.*`, and the repository's
    # Pages source must be "GitHub Actions" (Settings -> Pages). Otherwise this
    # job fails with "... is not allowed to deploy to github-pages due to
    # environment protection rules" while the site silently stays stale.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # This workflow never runs on pull requests, so a persistent failure is only
  # visible in the Actions tab. Track it in an issue instead, and close that
  # issue automatically once a deployment succeeds again.
  report-status:
    if: ${{ github.repository == 'aws/aws-lc-rs' && !cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v1.')) }}
    needs: [build-user-guide, deploy-user-guide]
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Open or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RESULT: ${{ needs.build-user-guide.result }}
          DEPLOY_RESULT: ${{ needs.deploy-user-guide.result }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-docs.yml
        run: |
          title='Documentation deployment is failing'
          existing="$(gh issue list --state open --search "in:title \"${title}\"" \
            --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"

          if [ "$BUILD_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Documentation deployed successfully from ${REF_NAME}: ${RUN_URL}"
            fi
            exit 0
          fi

          summary="build-user-guide: ${BUILD_RESULT}, deploy-user-guide: ${DEPLOY_RESULT}, ref: ${REF_NAME}, run: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing. ${summary}"
            exit 0
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          The [Deploy Documentation](${WORKFLOW_URL}) workflow failed (${summary}).

          The user guide and rustdocs at https://aws.github.io/aws-lc-rs/ stay frozen at the last successful deployment until this is fixed. If deploy-user-guide was rejected by environment protection rules, check that the github-pages environment allows deployments from main and v1.* tags and that the repository's Pages source is set to GitHub Actions.

          This issue is closed automatically by the next successful deployment.
          EOF
          gh issue create --title "$title" --label documentation --body-file "$body_file"
