name: Auto-generate aws-lc-fips-sys Bindings

on:
  push:
    branches:
      - 'generate/aws-lc-fips-sys-*'

env:
  GIT_AUTHOR_NAME: "aws-lc-fips-sys-bindings-generator"
  GIT_AUTHOR_EMAIL: "aws-lc-github-bot@amazon.com"
  GIT_COMMITTER_NAME: "aws-lc-fips-sys-bindings-generator"
  GIT_COMMITTER_EMAIL: "aws-lc-github-bot@amazon.com"
  RUST_BACKTRACE: 1
  # We can pin the version if nightly is too unstable.
  # Otherwise, we test against the latest version.
  RUST_NIGHTLY_TOOLCHAIN: nightly
  RUST_SCRIPT_NIGHTLY_TOOLCHAIN: nightly
  DEBIAN_FRONTEND: noninteractive
  # The output of this workflow is committed and published, so cross and its
  # images are pinned. When bumping CROSS_REV, also update CROSS_IMAGES to the
  # digests of the ghcr.io/cross-rs/<target>:main images built from it.
  CROSS_REV: 5f05d13dc37c0db79f4448642c68e108b977a9e1
  CROSS_IMAGES: |
    {
      "aarch64-unknown-linux-gnu": "ghcr.io/cross-rs/aarch64-unknown-linux-gnu@sha256:79c12cadab2b768ad594e3925a196584a572abf79941502e32c97fed4d654773",
      "aarch64-unknown-linux-musl": "ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:8e73c3bcd1202bc35925774bf76c29685001c99bf7fdf01b23981c67d4cc4148",
      "x86_64-unknown-linux-musl": "ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:eab7cc0b74c748c99fd74d3eafb526a924bf795658cf3308727fd2a84df2379e"
    }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

# Jobs that build or generate files run third-party code (cross and its images,
# crates.io build scripts, toolchains), so they only get read access and hand
# their output to a commit-* job as a patch. Only the commit-* jobs can push,
# and each only accepts changes under the paths its stage owns. This isolates
# write credentials; it does not prove generated content is benign. See
# scripts/ci/README.md for the security boundary and regeneration requirements.
permissions:
  contents: read

jobs:
  collect-symbols:
    if: github.repository == 'aws/aws-lc-rs'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, macos-15-intel, macos-latest ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.18'
      - name: Install current Bash on macOS
        if: runner.os == 'macOS'
        run: brew install bash coreutils
      - name: No-prefix build for ${{ matrix.os }}
        env:
          AWS_LC_FIPS_SYS_NO_PREFIX: "1"
        run: |
          cargo test -p aws-lc-fips-sys --features bindgen
      - name: Collect symbols
        run: |
          ./scripts/build/collect_symbols.sh -c aws-lc-fips-sys
      - name: Export changes
        run: ./scripts/ci/ci_export_generated_changes.sh "symbols-${{ matrix.os }}" aws-lc-fips-sys/symbols
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-${{ matrix.os }}
          path: ${{ runner.temp }}/generated-changes/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  collect-cross-symbols:
    if: github.repository == 'aws/aws-lc-rs'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [ aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl, x86_64-unknown-linux-musl ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.18'
      - name: Install cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev "${CROSS_REV}"
      - name: No-prefix build for ${{ matrix.target }}
        env:
          AWS_LC_FIPS_SYS_NO_PREFIX: "1"
          CROSS_BUILD_OPTS: --build-arg AWS_LC_CROSS_BASE_IMAGE=${{ fromJSON(env.CROSS_IMAGES)[matrix.target] }}
        run: |
          cross test -p aws-lc-fips-sys --features bindgen --target ${{ matrix.target }}
      - name: Collect symbols
        run: |
          ./scripts/build/collect_symbols.sh -c aws-lc-fips-sys -t ${{ matrix.target }}
      - name: Export changes
        run: ./scripts/ci/ci_export_generated_changes.sh "symbols-${{ matrix.target }}" aws-lc-fips-sys/symbols
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-${{ matrix.target }}
          path: ${{ runner.temp }}/generated-changes/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  commit-symbols:
    needs: [ collect-symbols, collect-cross-symbols ]
    if: github.repository == 'aws/aws-lc-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: symbols-*
          path: ${{ runner.temp }}/generated-changes
          merge-multiple: true
      - name: Commit & Push changes
        id: commit
        run: |
          ./scripts/ci/ci_commit_generated_changes.sh "Collected symbols" "${RUNNER_TEMP}/generated-changes" aws-lc-fips-sys/symbols
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
  generate-headers:
    needs: commit-symbols
    if: github.repository == 'aws/aws-lc-rs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'
          ref: ${{ needs.commit-symbols.outputs.sha }}
          persist-credentials: false
      - name: Install Rust toolchains
        run: |
          rustup toolchain install ${{ env.RUST_SCRIPT_NIGHTLY_TOOLCHAIN }} --profile minimal --no-self-update
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.18'
      - name: Generate Prefix Headers
        run: ./scripts/generate/_generate_prefix_headers.sh -f -c aws-lc-fips-sys
      - name: Update sys-crate metadata
        run: ./scripts/ci/update_sys_crate_metadata.sh aws-lc-fips-sys
      - name: Export changes
        run: ./scripts/ci/ci_export_generated_changes.sh headers aws-lc-fips-sys/generated-include aws-lc-fips-sys/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headers
          path: ${{ runner.temp }}/generated-changes/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  commit-headers:
    needs: [ commit-symbols, generate-headers ]
    if: github.repository == 'aws/aws-lc-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.commit-symbols.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: headers
          path: ${{ runner.temp }}/generated-changes
      - name: Commit & Push changes
        id: commit
        run: |
          ./scripts/ci/ci_commit_generated_changes.sh "Generated headers" "${RUNNER_TEMP}/generated-changes" aws-lc-fips-sys/generated-include aws-lc-fips-sys/Cargo.toml
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
  generate-bindings:
    needs: commit-headers
    if: github.repository == 'aws/aws-lc-rs'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-15-intel, macos-latest ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'
          ref: ${{ needs.commit-headers.outputs.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.18'
      - name: Install current Bash on macOS
        if: runner.os == 'macOS'
        run: brew install bash coreutils
      - name: Generate bindings for ${{ matrix.os }}
        env:
          AWS_LC_FIPS_SYS_PREGENERATING_BINDINGS: "1"
        run: |
          cargo test -p aws-lc-fips-sys --features bindgen
      - name: Export changes
        run: ./scripts/ci/ci_export_generated_changes.sh "bindings-${{ matrix.os }}" 'aws-lc-fips-sys/src/*_crypto.rs'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.os }}
          path: ${{ runner.temp }}/generated-changes/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  generate-cross-bindings:
    needs: commit-headers
    if: github.repository == 'aws/aws-lc-rs'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl, x86_64-unknown-linux-musl ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'
          ref: ${{ needs.commit-headers.outputs.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - name: Install cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev "${CROSS_REV}"
      - name: Generate bindings for ${{ matrix.target }}
        env:
          AWS_LC_FIPS_SYS_PREGENERATING_BINDINGS: "1"
          CROSS_BUILD_OPTS: --build-arg AWS_LC_CROSS_BASE_IMAGE=${{ fromJSON(env.CROSS_IMAGES)[matrix.target] }}
        run: |
          cross test -p aws-lc-fips-sys --features bindgen --target ${{ matrix.target }}
      - name: Export changes
        run: ./scripts/ci/ci_export_generated_changes.sh "bindings-${{ matrix.target }}" 'aws-lc-fips-sys/src/*_crypto.rs'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ runner.temp }}/generated-changes/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  commit-bindings:
    needs: [ commit-headers, generate-bindings, generate-cross-bindings ]
    if: github.repository == 'aws/aws-lc-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.commit-headers.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bindings-*
          path: ${{ runner.temp }}/generated-changes
          merge-multiple: true
      - name: Commit & Push changes
        run: ./scripts/ci/ci_commit_generated_changes.sh "Generated bindings" "${RUNNER_TEMP}/generated-changes" 'aws-lc-fips-sys/src/*_crypto.rs'
