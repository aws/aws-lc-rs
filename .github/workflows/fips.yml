name: fips

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  # We can pin the version if nightly is too unstable.
  # Otherwise, we test against the latest version.
  RUST_NIGHTLY_TOOLCHAIN: nightly
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: read

jobs:
  fips-test:
    if: github.repository_owner == 'aws'
    name: aws-lc-rs fips-tests
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
      CXX: clang++
    strategy:
      fail-fast: false
      matrix:
        rust: [ stable ]
        os: [ ubuntu-latest, macos-15-intel, macos-latest ]
        args:
          - --release --all-targets --features fips,unstable
          - --release --all-targets --features fips,unstable,legacy-des
          - --release --all-targets --features fips,legacy-des
          - --profile release-lto --all-targets --features fips,unstable
          - --no-default-features --features fips,unstable
          - --no-default-features --features fips,ring-io,unstable
          - --no-default-features --features fips,ring-sig-verify,unstable
          - --no-default-features --features fips,alloc,unstable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --no-self-update
          rustup default ${{ matrix.rust }}
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.18'
      - if: ${{ startsWith( matrix.os, 'macos-') }}
        name: Update Cmake
        # Use latest CMake
        run: |
          brew update
          brew uninstall --force cmake
          brew install --force cmake
          cmake --version
          echo 'CMAKE=${{ (matrix.os == 'macos-15-intel' && '/usr/local') || '/opt/homebrew' }}/bin/cmake' >> $GITHUB_ENV
      - name: Run cargo test
        working-directory: ./aws-lc-rs
        run: cargo test ${{ matrix.args }}
  fips-failure-callback-test:
    if: github.repository_owner == 'aws'
    name: aws-lc-rs fips-failure-callback-tests
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.18'
      - name: Run aws-lc-fips-sys tests
        working-directory: ./aws-lc-fips-sys
        run: cargo test --features fips-failure-callback
      - name: Run aws-lc-rs tests
        working-directory: ./aws-lc-rs
        run: cargo test --no-default-features --all-targets --features fips-failure-callback,unstable
  windows-fips-test:
    if: github.repository_owner == 'aws'
    name: aws-lc-rs windows-fips-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
        args:
          - --all-targets --features fips,unstable
          - --all-targets --features fips,bindgen,unstable
          - --release --all-targets --features fips,unstable
          - --no-default-features --features fips,unstable
          - --no-default-features --features fips,ring-io,unstable
          - --no-default-features --features fips,ring-sig-verify,unstable
          - --no-default-features --features fips,alloc,unstable
    steps:
      - uses: ilammy/setup-nasm@v1
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Run cargo test
        working-directory: ./aws-lc-rs
        run: cargo test ${{ matrix.args }}
  cpu-jitter-entropy-test:
    if: github.repository_owner == 'aws'
    name: CPU Jitter Entropy Tests
    runs-on: ubuntu-latest
    env:
      AWS_LC_FIPS_SYS_CPU_JITTER_ENTROPY: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup default nightly
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.18'
      - name: Run assert script
        run: ./scripts/tests/assert_cpu_jitter_entropy.rs
